<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<!-- Light or dark, before the first paint: the last pick (app.js saves it), light when there is none -->
<script>try { document.documentElement.dataset.theme = localStorage.getItem("hq-theme") === "dark" ? "dark" : "light"; }
catch { document.documentElement.dataset.theme = "light"; }</script>
<title>HQ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext x='16' y='23' font-size='18' font-family='system-ui' font-weight='700' text-anchor='middle' fill='%23b6913c'%3EHQ%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/public/app.css">
<link rel="stylesheet" href="/public/floor/floor.css">
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<header class="top">
  <span class="brand" id="app-name">HQ</span>
  <nav class="tabs" aria-label="Views">
    <a href="#dashboard" id="tab-dashboard">Dashboard</a>
    <a href="#office" id="tab-office">Office</a>
  </nav>
  <button type="button" class="quiet" id="streamer-top" aria-pressed="false" title="Hide every name and title, for recording">Streamer</button>
  <button type="button" class="quiet" id="theme-top" aria-pressed="false">Dark<span class="long"> mode</span></button>
  <button type="button" class="quiet" id="approvals" hidden>Approvals</button>
  <p class="pill" id="pill" aria-live="polite">Connecting</p>
  <div class="plan-stack" id="plan-stack" hidden><p class="plan" id="plan" hidden></p><p class="accts" id="accts" hidden></p></div>
  <div class="load-line" id="load-line" hidden></div>
</header>
<p class="stale" id="stale" hidden></p>
<main>
  <section id="view-dashboard" class="view">
    <div class="grid">
      <!-- The assistant's module, drawn by public/assistant.js (the room's glass panel draws the same) -->
      <section class="mod assistant" id="mod-assistant" aria-label="Assistant"></section>
      <section class="mod who"><h2>Who works with whom</h2><div class="team" id="team"></div></section>
      <div class="sep" aria-hidden="true"></div>
      <section class="mod live" id="live"><div class="nh"><h2>Live</h2></div><ul class="rows scroll" id="sessions"></ul></section>
      <!-- What every session waits on (public/queue.js), read-only; hidden with no coordination folder -->
      <section class="mod queue" id="queue" aria-label="Queue" aria-live="off" hidden></section>
      <section class="hero" id="hero"></section>
    </div>
    <section class="mod financials" id="financials"><h2>Financials</h2><div id="fin"></div></section>
  </section>
  <!-- The Office tab is the room alone; it is built the first time this view shows (app.js) -->
  <section id="view-office" class="view" hidden><div id="floor"></div></section>
</main>
<script type="module" src="/public/app.js"></script>
<!-- The Office's overlay, cloned into #floor by public/floor/stage.js when the room is built -->
<template id="floor-ui">
<header class="bar">
  <div class="brand"><span class="mark">HQ</span><span class="title">The Office</span></div>
  <nav class="seg" aria-label="Camera">
    <button data-view="boss" class="on">Boss</button>
    <button data-view="floor">Floor</button>
    <button data-view="agents">Agents</button>
    <button data-view="sessions">Sessions</button>
    <button data-view="top">Overhead</button>
  </nav>
  <button class="rally" id="rally">Rally<span class="long"> the floor</span></button>
</header>

<div class="pp-layer" id="pp-layer"></div>

<div class="foot-ui">
  <p class="pill legend"><span><i class="dot d-boss"></i>You</span><span><i class="dot d-work"></i>Working</span><span><i class="dot d-idle"></i>Idle, no task</span><span><i class="dot d-off"></i>Off</span></p>
  <p class="pill hint">Drag to orbit · WASD to move · Click anyone or your desk</p>
  <div class="pill ctls"><button type="button" id="streamer" aria-pressed="false" title="Hide every name and task, for recording">Streamer</button><button type="button" id="expand">Full screen</button></div>
</div>

<aside class="panel" id="panel" aria-live="polite">
  <button class="x" id="close" aria-label="Close">&times;</button>
  <p class="eyebrow" id="p-dept"></p>
  <h2 id="p-name"></h2>
  <p class="status"><i class="dot" id="p-dot"></i><span id="p-status"></span></p>
  <p class="doing" id="p-doing"></p>
  <div class="beat" id="p-beat" hidden><p class="task" id="p-task"></p><ul id="p-sum"></ul><p class="upd" id="p-upd"></p></div>
  <button class="move" id="p-move" type="button" hidden></button>
  <p class="look" id="p-look"></p>
  <div class="swatches" id="p-sw"></div>
  <p class="sect">Avatar data</p>
  <pre id="p-json"></pre>
  <p class="note" id="p-note"></p>
</aside>

<div class="loading" id="loading">Building the Office</div>
</template>
</body>
</html>
